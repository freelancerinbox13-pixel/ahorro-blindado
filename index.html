<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahorro Blindado</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent: #38bdf8;
            --green: #22c55e;
            --red: #ef4444;
            --warning: #f59e0b;
            --border: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }
        h1, h2 { text-align: center; color: var(--accent); }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        button {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
        button:active { opacity: 0.8; }
        .btn-green { background-color: var(--green); color: white; }
        .btn-red { background-color: var(--red); color: white; }
        .btn-warning { background-color: var(--warning); color: #0f172a; }
        .status-box {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 4px;
            margin-right: 5px;
        }
        .status-green { background-color: var(--green); }
        .status-red { background-color: var(--red); }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }
        .calc-box {
            background: #0b0f19;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 14px;
            color: #38bdf8;
            border: 1px dashed var(--accent);
        }
    </style>
</head>
<body>

    <h1>🛡️ Ahorro Blindado</h1>

    <!-- SECCIÓN: CONFIGURACIÓN CRIPTO (OPCIONAL) -->
    <div class="card">
        <h2>🔗 Cartera Crypto de Ahorro (Opcional)</h2>
        <p style="font-size: 13px; color: #94a3b8;">Vincula una wallet (USDT/USDC en Polygon o Arbitrum) para tu ahorro serio:</p>
        <label>Dirección o URL de la Wallet:</label>
        <input type="text" id="cryptoWallet" placeholder="Ej. 0xYourWalletAddress...">
        <button onclick="guardarWallet()" style="background:#6366f1; color:white;">Guardar Billetera</button>
        <div id="walletStatus" style="font-size: 12px; color: var(--green); margin-top: 6px;"></div>
    </div>

    <!-- SECCIÓN: SELECCIÓN DE TIPO DE AHORRO -->
    <div class="card">
        <h2>🧮 Calculadora de Ahorro</h2>
        
        <label>¿Qué tipo de cálculo deseas hacer?</label>
        <select id="tipoCalculadora" onchange="cambiarTipoCalculadora()">
            <option value="meta">Meta de Compra (Ordenador, Coche, TV...)</option>
            <option value="sueldo">Ahorro por Porcentaje de Sueldo / Ingresos</option>
        </select>

        <!-- BLOQUE 1: METAS DE COMPRA -->
        <div id="seccionMeta">
            <label>¿Qué quieres comprar?</label>
            <input type="text" id="metaName" placeholder="Ej. Ordenador, Coche...">
            
            <label>Importe objetivo (€ / USDT)</label>
            <input type="number" id="metaAmount" placeholder="1200">

            <label>Modo de Plazo:</label>
            <select id="modoCalculo" onchange="cambiarModoPlazo()">
                <option value="fechas">Tengo fechas límite (Calcular cuota necesaria)</option>
                <option value="cuota">Sé cuánto puedo pagar al mes (Calcular tiempo)</option>
            </select>

            <div id="bloqueFechas">
                <div style="display: flex; gap: 10px;">
                    <div style="flex:1;">
                        <label>Fecha de Inicio:</label>
                        <input type="date" id="fechaInicio">
                    </div>
                    <div style="flex:1;">
                        <label>Fecha de Fin:</label>
                        <input type="date" id="fechaFin">
                    </div>
                </div>
            </div>

            <div id="bloqueCuota" style="display:none;">
                <label>¿Cuánto puedes aportar por mes (€)?</label>
                <input type="number" id="aporteMensual" placeholder="Ej. 50">
            </div>

            <label>Estrategia de Compra:</label>
            <select id="metaTechniqueMeta">
                <option value="Corto Plazo (Cuota fija / Reto)">Corto Plazo (Cuota fija / Reto - Ej. Ordenador / TV)</option>
                <option value="Medio/Largo Plazo (Fondo dedicado)">Medio/Largo Plazo (Fondo dedicado - Ej. Coche)</option>
                <option value="Presupuesto Base Cero">Presupuesto Base Cero</option>
                <option value="Hucha de Redondeo">Hucha de Redondeo</option>
            </select>
        </div>

        <!-- BLOQUE 2: PORCENTAJE DE SUELDO -->
        <div id="seccionSueldo" style="display:none;">
            <label>Tus ingresos netos mensuales (€):</label>
            <input type="number" id="sueldoNeto" placeholder="Ej. 2000">

            <label>Regla de Porcentajes:</label>
            <select id="metaTechniqueSueldo">
                <option value="Regla 50/30/20">Regla 50/30/20 (50% Gastos, 30% Ocio, 20% Ahorro)</option>
                <option value="Regla 70/20/10">Regla 70/20/10 (70% Gastos, 20% Ahorro, 10% Inversión)</option>
            </select>
        </div>

        <button class="btn-warning" onclick="calcularPlan()" style="margin-top: 12px;">🔍 Calcular Plan</button>

        <div id="resultadoCalculo" class="calc-box" style="display:none;"></div>

        <div style="display: flex; gap: 10px; margin-top: 12px;">
            <button class="btn-green" style="flex:1;" onclick="comenzarMeta()">Comenzar Meta</button>
            <button class="btn-red" style="flex:1;" onclick="limpiarFormulario()">Cancelar</button>
        </div>
    </div>

    <!-- SECCIÓN: MIS METAS ACTIVAS -->
    <div class="card">
        <h2>Mis Metas Activas Programadas</h2>
        <div id="metasList">Cargando metas...</div>
    </div>

    <!-- SECCIÓN: ANTI-CAPRICHOS -->
    <div class="card">
        <h2>☕ Hucha Anti-Caprichos</h2>
        <label>Concepto (Café, Caña...):</label>
        <input type="text" id="caprichoConcepto" placeholder="Ej. Café evitado">
        <label>Importe ahorrado (€):</label>
        <input type="number" step="0.01" id="caprichoMonto" placeholder="1.50">
        <button class="btn-green" onclick="sumarAntiCapricho()">A sumar a la Meta Activa</button>
    </div>

    <!-- SECCIÓN: REGLA DE LAS 48 HORAS -->
    <div class="card">
        <h2>⏳ Filtro Anti-Impulsos (Regla 48h)</h2>
        <label>Producto deseado:</label>
        <input type="text" id="deseoNombre" placeholder="Ej. Zapatillas">
        <label>Precio (€):</label>
        <input type="number" id="deseoPrecio" placeholder="80">
        <button class="btn-warning" onclick="agregarDeseo()">Congelar Capricho (48h)</button>
        <div id="deseosList" style="margin-top: 12px;"></div>
    </div>

    <script>
        let metas = JSON.parse(localStorage.getItem('ahorro_metas')) || [];
        let deseos = JSON.parse(localStorage.getItem('ahorro_deseos')) || [];
        let wallet = localStorage.getItem('ahorro_wallet') || '';
        let calculoTemporal = null;

        if(wallet) {
            document.getElementById('cryptoWallet').value = wallet;
            document.getElementById('walletStatus').innerText = 'Wallet vinculada: ' + wallet.substring(0, 15) + '...';
        }

        function guardarWallet() {
            wallet = document.getElementById('cryptoWallet').value;
            localStorage.setItem('ahorro_wallet', wallet);
            document.getElementById('walletStatus').innerText = wallet ? 'Wallet vinculada.' : '';
            alert('Billetera guardada.');
        }

        function cambiarTipoCalculadora() {
            const tipo = document.getElementById('tipoCalculadora').value;
            if(tipo === 'meta') {
                document.getElementById('seccionMeta').style.display = 'block';
                document.getElementById('seccionSueldo').style.display = 'none';
            } else {
                document.getElementById('seccionMeta').style.display = 'none';
                document.getElementById('seccionSueldo').style.display = 'block';
            }
            document.getElementById('resultadoCalculo').style.display = 'none';
        }

        function cambiarModoPlazo() {
            const modo = document.getElementById('modoCalculo').value;
            if(modo === 'fechas') {
                document.getElementById('bloqueFechas').style.display = 'block';
                document.getElementById('bloqueCuota').style.display = 'none';
            } else {
                document.getElementById('bloqueFechas').style.display = 'none';
                document.getElementById('bloqueCuota').style.display = 'block';
            }
            document.getElementById('resultadoCalculo').style.display = 'none';
        }

        function limpiarFormulario() {
            document.getElementById('metaName').value = '';
            document.getElementById('metaAmount').value = '';
            document.getElementById('sueldoNeto').value = '';
            document.getElementById('fechaInicio').value = '';
            document.getElementById('fechaFin').value = '';
            document.getElementById('aporteMensual').value = '';
            document.getElementById('resultadoCalculo').style.display = 'none';
            calculoTemporal = null;
            alert('Formulario limpiado.');
        }

        function calcularPlan() {
            const tipo = document.getElementById('tipoCalculadora').value;
            let name, amount, technique, inicio, fin, daysLeft, textoCalculo;

            if(tipo === 'meta') {
                name = document.getElementById('metaName').value;
                amount = parseFloat(document.getElementById('metaAmount').value);
                technique = document.getElementById('metaTechniqueMeta').value;
                const modo = document.getElementById('modoCalculo').value;

                if(!name || isNaN(amount) || amount <= 0) {
                    alert('Introduce el nombre de la meta y un importe objetivo válido.');
                    return;
                }

                if(modo === 'fechas') {
                    inicio = document.getElementById('fechaInicio').value;
                    fin = document.getElementById('fechaFin').value;
                    if(!inicio || !fin) {
                        alert('Selecciona la fecha de inicio y de fin.');
                        return;
                    }
                    const d1 = new Date(inicio);
                    const d2 = new Date(fin);
                    daysLeft = Math.ceil(Math.abs(d2 - d1) / (1000 * 60 * 60 * 24)) || 1;
                    const diario = (amount / daysLeft).toFixed(2);
                    const mensual = (amount / (daysLeft / 30)).toFixed(2);
                    textoCalculo = `Meta de compra (${name}): <b>${diario}€/día</b> o <b>${mensual}€/mes</b> necesarios.`;
                } else {
                    const aporte = parseFloat(document.getElementById('aporteMensual').value);
                    if(isNaN(aporte) || aporte <= 0) {
                        alert('Introduce una cantidad válida que puedas pagar por mes.');
                        return;
                    }
                    inicio = new Date().toISOString().split('T')[0];
                    const mesesNecesarios = amount / aporte;
                    daysLeft = Math.ceil(mesesNecesarios * 30);
                    const fechaFinalObj = new Date();
                    fechaFinalObj.setDate(fechaFinalObj.getDate() + daysLeft);
                    fin = fechaFinalObj.toISOString().split('T')[0];
                    textoCalculo = `Meta de compra (${name}): Pagando ${aporte}€/mes tardarás <b>${mesesNecesarios.toFixed(1)} meses</b>.`;
                }
            } else {
                const sueldo = parseFloat(document.getElementById('sueldoNeto').value);
                technique = document.getElementById('metaTechniqueSueldo').value;

                if(isNaN(sueldo) || sueldo <= 0) {
                    alert('Introduce tus ingresos netos mensuales.');
                    return;
                }

                name = `Ahorro por Sueldo (${technique})`;
                let ahorroMensual = 0;
                if(technique === 'Regla 50/30/20') {
                    ahorroMensual = sueldo * 0.20;
                    textoCalculo = `De tu sueldo de ${sueldo}€, tu <b>20% de ahorro mensual es de ${ahorroMensual.toFixed(2)}€</b> (50% gastos / 30% ocio).`;
                } else {
                    ahorroMensual = sueldo * 0.20 + sueldo * 0.10; // 20% ahorro + 10% inversión
                    textoCalculo = `De tu sueldo de ${sueldo}€, destinas un <b>30% total (${ahorroMensual.toFixed(2)}€/mes)</b> a ahorro e inversión (Regla 70/20/10).`;
                }

                amount = ahorroMensual * 12; // Anual de referencia
                inicio = new Date().toISOString().split('T')[0];
                const fechaFinalObj = new Date();
                fechaFinalObj.setFullYear(fechaFinalObj.getFullYear() + 1);
                fin = fechaFinalObj.toISOString().split('T')[0];
                daysLeft = 365;
            }

            calculoTemporal = { name, amount, technique, inicio, fin, daysLeft, textoCalculo };

            const box = document.getElementById('resultadoCalculo');
            box.style.display = 'block';
            box.innerHTML = `📌 <b>Resultado del cálculo:</b><br>${textoCalculo}`;
        }

        function comenzarMeta() {
            if(!calculoTemporal) {
                alert('Por favor, pulsa primero el botón de "Calcular Plan".');
                return;
            }

            const nuevaMeta = {
                id: Date.now(),
                name: calculoTemporal.name,
                amount: calculoTemporal.amount,
                technique: calculoTemporal.technique,
                inicio: calculoTemporal.inicio,
                fin: calculoTemporal.fin,
                textoCalculo: calculoTemporal.textoCalculo,
                saved: 0,
                daysLeft: calculoTemporal.daysLeft,
                status: 'red'
            };

            metas.push(nuevaMeta);
            guardarYRenderizarMetas();
            limpiarFormulario();
            alert('¡Meta programada e iniciada con éxito!');
        }

        function sumarAntiCapricho() {
            if(metas.length === 0) {
                alert('Crea una meta primero.');
                return;
            }
            const concepto = document.getElementById('caprichoConcepto').value || 'Gasto evitado';
            const monto = parseFloat(document.getElementById('caprichoMonto').value);

            if(isNaN(monto) || monto <= 0) {
                alert('Introduce un importe válido.');
                return;
            }

            metas[0].saved += monto;
            metas[0].status = 'green';
            guardarYRenderizarMetas();
            alert(`¡Anotado! ${monto}€ de "${concepto}" sumados.`);
            document.getElementById('caprichoConcepto').value = '';
            document.getElementById('caprichoMonto').value = '';
        }

        function agregarDeseo() {
            const nombre = document.getElementById('deseoNombre').value;
            const precio = document.getElementById('deseoPrecio').value;
            if(!nombre || !precio) return alert('Rellena los datos del capricho.');

            deseos.push({ id: Date.now(), nombre, precio, horas: 48 });
            localStorage.setItem('ahorro_deseos', JSON.stringify(deseos));
            renderDeseos();
            alert('Capricho congelado en periodo de reflexión de 48 horas.');
        }

        function guardarYRenderizarMetas() {
            localStorage.setItem('ahorro_metas', JSON.stringify(metas));
            renderMetas();
        }

        function renderMetas() {
            const container = document.getElementById('metasList');
            if(metas.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#64748b;">No hay metas activas.</p>';
                return;
            }
            container.innerHTML = '';
            metas.forEach(meta => {
                const porcentaje = Math.min(100, (meta.saved / meta.amount) * 100).toFixed(1);

                container.innerHTML += `
                    <div style="border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 12px;">
                        <strong>🎯 ${meta.name}</strong><br>
                        Estrategia: <i>${meta.technique}</i><br>
                        🗓️ Plazo: ${meta.inicio} al ${meta.fin}<br>
                        Progreso: ${meta.saved.toFixed(2)}€ / ${meta.amount}€ (${porcentaje}%)<br>
                        
                        <div class="calc-box">
                            📊 <b>${meta.textoCalculo}</b>
                        </div>

                        Estado hoy: <span class="status-box status-${meta.status}"></span> ${meta.status === 'green' ? 'Validado 🟢' : 'Pendiente / Rojo 🔴'}<br>
                        <button onclick="validarDia(${meta.id})" class="btn-green">Validar Día (Check-in)</button>
                        <button onclick="eliminarMeta(${meta.id})" class="btn-red" style="margin-top:4px;">Eliminar / Cancelar Meta</button>
                    </div>
                `;
            });
        }

        function eliminarMeta(id) {
            if(confirm('¿Seguro que deseas eliminar esta meta?')) {
                metas = metas.filter(m => m.id !== id);
                guardarYRenderizarMetas();
            }
        }

        function renderDeseos() {
            const container = document.getElementById('deseosList');
            if(deseos.length === 0) {
                container.innerHTML = '<span style="color:#64748b; font-size:13px;">No hay impulsos congelados.</span>';
                return;
            }
            container.innerHTML = '';
            deseos.forEach(d => {
                container.innerHTML += `<div style="font-size:13px; background:#0f172a; padding:6px; border-radius:6px; margin-top:4px;">⏳ <b>${d.nombre}</b> (${d.precio}€) - Enfríando deseos (48h)</div>`;
            });
        }

        function validarDia(id) {
            const meta = metas.find(m => m.id === id);
            if(meta) {
                meta.status = 'green';
                guardarYRenderizarMetas();
                alert('¡Día validado en verde!');
            }
        }

        renderMetas();
        renderDeseos();
    </script>
</body>
</html>
